name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - name: Check out the submitted code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Check generated cards, build C++ and run CTest
        run: python tools/check_pr.py --suite native

      - name: Set up Node.js matching the server
        if: runner.os == 'Linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Build web client and test four-player mobile gameplay
        if: runner.os == 'Linux'
        run: python tools/check_pr.py --suite web --install-browser

      - name: Keep test logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-results-${{ matrix.os }}
          path: |
            build/pr-checks/Testing/Temporary/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: PR checks
    if: always()
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Require every platform to pass
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
